<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" aria-hidden="true" focusable="false">
  <!-- Card body -->
  <rect class="card-edge" x="1" y="1" width="98" height="138" rx="8" fill="#fbf7ec" stroke="#2b2118" stroke-width="2"/>
  <rect class="card-face-frame" x="6" y="6" width="88" height="128" rx="4" fill="none" stroke="#d4af37" stroke-width="1"/>

  <!-- Top-left index -->
  <g class="card-face-index">
    <text class="card-face-rank" x="16" y="26" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="#c0392b">A</text>
    <path class="card-face-pip" transform="translate(5.5 17.4) scale(0.22)" d="M50 92 C20 70 26 48 40 48 C46 48 50 52 50 56 C50 52 54 48 60 48 C74 48 80 70 50 92 Z" fill="#c0392b"/>
  </g>

  <!-- Bottom-right index (rotated copy) -->
  <g class="card-face-index" transform="rotate(180 50 70)">
    <text class="card-face-rank" x="16" y="26" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="#c0392b">A</text>
    <path class="card-face-pip" transform="translate(5.5 17.4) scale(0.22)" d="M50 92 C20 70 26 48 40 48 C46 48 50 52 50 56 C50 52 54 48 60 48 C74 48 80 70 50 92 Z" fill="#c0392b"/>
  </g>

  <!-- Center heart -->
  <path class="card-face-heart" transform="translate(50 70) scale(1.15) translate(-50 -70)" d="M50 92 C20 70 26 48 40 48 C46 48 50 52 50 56 C50 52 54 48 60 48 C74 48 80 70 50 92 Z" fill="#c0392b"/>
</svg>
