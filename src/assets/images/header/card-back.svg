<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" aria-hidden="true" focusable="false" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="card-back-lattice" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0H10M0 0V10" fill="none" stroke="#d4af37" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Card body and cream border -->
  <rect class="card-edge" x="1" y="1" width="98" height="138" rx="8" fill="#f6f0e1" stroke="#2b2118" stroke-width="2"/>

  <!-- Back field and diamond lattice -->
  <rect class="card-back-field" x="7" y="7" width="86" height="126" rx="4" fill="#8b1e2d"/>
  <rect class="card-back-lattice" x="7" y="7" width="86" height="126" rx="4" fill="url(#card-back-lattice)"/>

  <!-- Inner gold frame -->
  <rect class="card-back-frame" x="12" y="12" width="76" height="116" rx="2" fill="none" stroke="#d4af37" stroke-width="1.5"/>

  <!-- Center emblem -->
  <path class="card-back-emblem" d="M50 44 L74 70 L50 96 L26 70 Z" fill="#8b1e2d" stroke="#d4af37" stroke-width="2"/>
  <path class="card-back-emblem-core" d="M50 56 L62 70 L50 84 L38 70 Z" fill="#d4af37"/>
</svg>
